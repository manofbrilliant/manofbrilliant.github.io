      [x-cloak] {

      } /* ================================
    MODERN PRELOADER
 ================================ */

 #preloader {
     position: fixed;
     inset: 0;
     width: 100%;
     height: 100vh;

     background: #ffffff;

     display: flex;
     justify-content: center;
     align-items: center;

     z-index: 99999;

     opacity: 1;
     visibility: visible;

     transition:
         opacity 0.6s ease,
         visibility 0.6s ease;

     overflow: hidden;
 }


 /* ================================
    LOGO
 ================================ */

 .preloader-logo {
     width: 170px;
     height: auto;

     position: relative;
     z-index: 2;

     animation:
         logoFloat 1.6s ease-in-out infinite,
         logoFade 1.2s ease-in-out infinite alternate;
 }


 /* ================================
    GLOW EFFECT
 ================================ */

 #preloader::before {
     content: "";

     position: absolute;

     width: 220px;
     height: 220px;

     border-radius: 50%;

     background: radial-gradient(
         circle,
         rgba(0, 0, 0, 0.07) 0%,
         rgba(0, 0, 0, 0.025) 45%,
         transparent 70%
     );

     animation: glowPulse 2s ease-in-out infinite;
 }


 /* ================================
    ROTATING OUTER RING
 ================================ */

 #preloader::after {
     content: "";

     position: absolute;

     width: 215px;
     height: 215px;

     border-radius: 50%;

     border: 1px solid rgba(0, 0, 0, 0.08);

     border-top-color: #111111;

     animation: rotateRing 1.4s linear infinite;
 }


 /* ================================
    LOGO FLOAT
 ================================ */

 @keyframes logoFloat {

     0% {
         transform: translateY(4px) scale(0.96);
     }

     50% {
         transform: translateY(-4px) scale(1);
     }

     100% {
         transform: translateY(4px) scale(0.96);
     }

 }


 /* ================================
    LOGO FADE
 ================================ */

 @keyframes logoFade {

     from {
         opacity: 0.72;
     }

     to {
         opacity: 1;
     }

 }


 /* ================================
    RING ROTATION
 ================================ */

 @keyframes rotateRing {

     from {
         transform: rotate(0deg);
     }

     to {
         transform: rotate(360deg);
     }

 }


 /* ================================
    GLOW ANIMATION
 ================================ */

 @keyframes glowPulse {

     0%,
     100% {
         transform: scale(0.85);
         opacity: 0.5;
     }

     50% {
         transform: scale(1.08);
         opacity: 1;
     }

 }


 /* ================================
    HIDE PRELOADER
 ================================ */

 #preloader.hide {
     opacity: 0;
     visibility: hidden;
     pointer-events: none;
 }


 /* ================================
    MOBILE
 ================================ */

 @media (max-width: 600px) {

     .preloader-logo {
         width: 150px;
     }

     #preloader::before {
         width: 170px;
         height: 170px;
     }

     #preloader::after {
         width: 165px;
         height: 165px;
     }

 }


 /* ================================
    DARK MODE
 ================================ */

 html.dark #preloader,
 .dark #preloader {
     background: #090909;
 }

 html.dark #preloader::before,
 .dark #preloader::before {
     background: radial-gradient(
         circle,
         rgba(255, 255, 255, 0.08) 0%,
         rgba(255, 255, 255, 0.025) 45%,
         transparent 70%
     );
 }

 html.dark #preloader::after,
 .dark #preloader::after {
     border-color: rgba(255, 255, 255, 0.08);
     border-top-color: #ffffff;
 }

<style>
    /* Poster page */
    .poster-section {
      width: 100%;
      margin: 0 auto 1.5rem;
    }

    /*
      Desktop:
      The poster itself becomes a scrollable page/viewer.
      Header and footer remain the same as the original website.
    */
    .poster-scroll {
      width: 100%;
      height: calc(100vh - 170px);
      min-height: 520px;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0 0 18px;
      border-radius: 14px;
      background: #090909;
      overscroll-behavior: contain;
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: #666 #151515;
    }

    .poster-scroll::-webkit-scrollbar {
      width: 9px;
    }

    .poster-scroll::-webkit-scrollbar-track {
      background: #151515;
      border-radius: 20px;
    }

    .poster-scroll::-webkit-scrollbar-thumb {
      background: #666;
      border-radius: 20px;
      border: 2px solid #151515;
    }

    .tribute-poster {
      display: block;
      width: min(100%, 760px);
      height: auto;
      flex: 0 0 auto;
      margin: 0 auto;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Dark mode keeps the poster viewer seamless with the original site. */
    html.dark .poster-scroll,
    .dark .poster-scroll {
      background: #050505;
      scrollbar-color: #777 #101010;
    }

    html.dark .poster-scroll::-webkit-scrollbar-track,
    .dark .poster-scroll::-webkit-scrollbar-track {
      background: #101010;
    }

    html.dark .poster-scroll::-webkit-scrollbar-thumb,
    .dark .poster-scroll::-webkit-scrollbar-thumb {
      background: #777;
      border-color: #101010;
    }

    /*
      Mobile:
      Disable the internal desktop viewer and let the normal page scroll.
      This makes the poster fully responsive and easy to use on phones.
    */
    @media (max-width: 767px) {
      .poster-section {
        margin-bottom: 1rem;
      }

      .poster-scroll {
        height: auto;
        min-height: 0;
        overflow: visible;
        padding: 0;
        border-radius: 10px;
        background: #090909;
      }

      .tribute-poster {
        width: 100%;
        max-width: 100%;
        height: auto;
      }
    }

    @media (min-width: 768px) {
      .poster-scroll {
        max-height: calc(100vh - 170px);
      }
    }
  </style>
<script>
    // Hide the same preloader used by the original page.
    window.addEventListener("load", function () {
      setTimeout(function () {
        const preloader = document.getElementById("preloader");
        if (preloader) preloader.classList.add("hide");
      }, 900);
    });
  </script>
